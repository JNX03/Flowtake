<!DOCTYPE html>
<html data-theme="flowtake-dark" lang="en" class="h-full max-h-full" style="background: transparent !important;">

<head>
  <meta charset="UTF-8" />
  <title>Window Picker - Flowtake</title>
  <link rel="icon" type="image/png" href="../src/assets/favicon.png" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://asset.localhost asset:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://asset.localhost asset:; media-src 'self' blob: data: https://asset.localhost asset: stream:; connect-src 'self' https: http: ws: wss: ipc: https://asset.localhost asset:; font-src 'self' data:;" />
  <style>
    :root, html, body, #root { background-color: transparent !important; }
  </style>
</head>

<body class="hyphens-auto h-full max-h-full" style="background: transparent !important;">
  <div id="root" class="h-full max-h-full p-0 m-0"></div>
  <script>
    document.addEventListener('contextmenu', function(e) {
      var t = e.target;
      if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable) return;
      e.preventDefault();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12') { e.preventDefault(); }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); }
      if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); }
    });
  </script>
  <script type="module" src="./src/windowPicker.jsx"></script>
</body>

</html>
