<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="50%" stop-color="#E84393"/>
      <stop offset="100%" stop-color="#00CEC9"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Play/flow arrow shape -->
  <path d="M200 148 L200 364 L360 256 Z" fill="url(#arrow)" opacity="0.95"/>
  <!-- Flow lines -->
  <path d="M140 200 Q180 256 140 312" stroke="white" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M108 220 Q140 256 108 292" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>
