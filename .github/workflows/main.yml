name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.23.1)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg (static Windows x64)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Downloading FFmpeg..."
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $ffmpegExe = Get-ChildItem -Recurse -Path ffmpeg_tmp -Filter "ffmpeg.exe" |
            Where-Object { $_.DirectoryName -like "*bin*" } |
            Select-Object -First 1
          if (-not $ffmpegExe) {
            Write-Error "ffmpeg.exe not found in archive"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item -Path $ffmpegExe.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          Write-Host "FFmpeg placed at src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Windows installers and portable binary
        shell: bash
        run: |
          mkdir -p installers

          # Installers
          cp src-tauri/target/release/bundle/nsis/*.exe installers/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi installers/ 2>/dev/null || true

          # Portable standalone binary (zip with ffmpeg sidecar)
          mkdir -p _portable/Flowtake
          cp src-tauri/target/release/flowtake.exe _portable/Flowtake/Flowtake.exe
          cp src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe _portable/Flowtake/ffmpeg.exe 2>/dev/null || true
          cd _portable && 7z a -tzip ../installers/Flowtake-windows-x64-portable.zip Flowtake/ && cd ..

          echo "=== Collected files ==="
          ls -la installers/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: installers/*

  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libpulse-dev \
            rpm \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg (static Linux x64)
        run: |
          echo "Downloading FFmpeg static build for Linux x64..."
          curl -L "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
            -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          FFMPEG_BIN=$(find . -maxdepth 3 -name "ffmpeg" -type f -not -name "*.tar.xz" | head -1)
          if [ -z "$FFMPEG_BIN" ]; then
            echo "ERROR: ffmpeg binary not found in archive"
            exit 1
          fi
          mkdir -p src-tauri/binaries
          cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          echo "FFmpeg placed at src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu"

      - name: Build Tauri app
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux installers and portable binary
        run: |
          mkdir -p installers

          # Installers
          cp src-tauri/target/release/bundle/deb/*.deb installers/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage installers/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm installers/ 2>/dev/null || true

          # Portable standalone binary (tar.gz with ffmpeg sidecar)
          mkdir -p _portable/Flowtake
          cp src-tauri/target/release/flowtake _portable/Flowtake/flowtake
          chmod +x _portable/Flowtake/flowtake
          cp src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu _portable/Flowtake/ffmpeg 2>/dev/null || true
          chmod +x _portable/Flowtake/ffmpeg 2>/dev/null || true
          tar -czf installers/Flowtake-linux-x64-portable.tar.gz -C _portable Flowtake

          echo "=== Collected files ==="
          ls -la installers/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: installers/*

  build-macos:
    name: Build (macOS Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg (macOS)
        run: |
          mkdir -p src-tauri/binaries

          # Download FFmpeg for macOS arm64
          echo "Downloading FFmpeg for macOS arm64..."
          curl -L "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64.gz" \
            -o ffmpeg-arm64.gz
          gunzip -f ffmpeg-arm64.gz
          chmod +x ffmpeg-arm64

          # Download FFmpeg for macOS x86_64
          echo "Downloading FFmpeg for macOS x86_64..."
          curl -L "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64.gz" \
            -o ffmpeg-x64.gz
          gunzip -f ffmpeg-x64.gz
          chmod +x ffmpeg-x64

          # Create universal fat binary with lipo (required for --target universal-apple-darwin)
          echo "Creating universal FFmpeg binary with lipo..."
          lipo -create -output src-tauri/binaries/ffmpeg-universal-apple-darwin \
            ffmpeg-arm64 ffmpeg-x64
          chmod +x src-tauri/binaries/ffmpeg-universal-apple-darwin

          # Also place per-arch copies (needed for per-arch compilation steps)
          cp ffmpeg-arm64 src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp ffmpeg-x64 src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin

          echo "FFmpeg binaries ready (universal + per-arch)"

      - name: Build Tauri app (universal macOS)
        run: npm run build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect macOS installers and portable app
        run: |
          mkdir -p installers

          # Installers
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg installers/ 2>/dev/null || true

          # Portable .app bundle (zip it for direct download)
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Flowtake.app"
          if [ -d "$APP_PATH" ]; then
            cd src-tauri/target/universal-apple-darwin/release/bundle/macos
            zip -r -y ../../../../../../installers/Flowtake-macos-universal.zip Flowtake.app
            cd ../../../../../../
          fi

          # Also grab the .app.tar.gz if Tauri generated it
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz installers/ 2>/dev/null || true

          echo "=== Collected files ==="
          ls -la installers/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: installers/*

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    if: always() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Generate changelog from commits
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Current tag: $TAG"

          # Find the previous tag (exclude current tag)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          echo "Previous tag: ${PREV_TAG:-none}"

          # Use HEAD as the endpoint (the checkout IS the tagged commit)
          # Fall back gracefully if git log fails
          if [ -n "$PREV_TAG" ] && git rev-parse "${PREV_TAG}" >/dev/null 2>&1; then
            CHANGELOG=$(git log --pretty=format:"- %h %s (%an)" --reverse "${PREV_TAG}..HEAD" 2>/dev/null || echo "- See full commit history on GitHub")
          else
            echo "No valid previous tag, listing recent commits"
            CHANGELOG=$(git log --pretty=format:"- %h %s (%an)" --reverse -50 HEAD 2>/dev/null || echo "- See full commit history on GitHub")
          fi

          # Write to file to preserve formatting
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "Generated changelog with $(wc -l < /tmp/changelog.txt) entries"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Build release body
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CHANGELOG=$(cat /tmp/changelog.txt)
          cat > /tmp/release_body.md << EOF
          ## Flowtake ${TAG}

          **Screen recorder with automatic zoom animations** — available for Windows, macOS, and Linux.

          ---

          ### Download

          | Platform | File | Notes |
          |----------|------|-------|
          | **Windows** (x64) | \`.exe\` installer | Recommended — guided setup with NSIS |
          | **Windows** (x64) | \`.msi\` installer | Silent / enterprise installs |
          | **Windows** (x64) | \`-portable.zip\` | No install needed — extract and run |
          | **macOS** (Universal) | \`.dmg\` | Runs natively on Apple Silicon & Intel |
          | **macOS** (Universal) | \`.zip\` | Portable — extract Flowtake.app directly |
          | **Linux** (x64) | \`.AppImage\` | Portable — works on any Linux distro |
          | **Linux** (x64) | \`.deb\` | Debian, Ubuntu, and derivatives |
          | **Linux** (x64) | \`.rpm\` | Fedora, RHEL, openSUSE, and derivatives |
          | **Linux** (x64) | \`-portable.tar.gz\` | No install needed — extract and run |

          ---

          ### Installation Instructions

          #### Windows
          1. Download the \`.exe\` installer
          2. Run it and follow the on-screen prompts
          3. FFmpeg is bundled — no extra dependencies needed

          #### macOS
          1. Download the \`.dmg\` file
          2. Open the disk image and drag **Flowtake** into your Applications folder
          3. On first launch, right-click the app → **Open** if macOS shows an unverified developer warning
          4. FFmpeg is bundled — no extra dependencies needed

          #### Linux
          - **Debian/Ubuntu** (\`.deb\`):
            \`\`\`bash
            sudo dpkg -i flowtake_*.deb
            sudo apt-get install -f   # resolve any missing dependencies
            \`\`\`
          - **AppImage** (universal):
            \`\`\`bash
            chmod +x Flowtake_*.AppImage
            ./Flowtake_*.AppImage
            \`\`\`
          - **Fedora/RHEL** (\`.rpm\`):
            \`\`\`bash
            sudo rpm -i flowtake-*.rpm
            \`\`\`

          > **Linux note:** The \`.deb\` and \`.rpm\` packages declare ffmpeg, xdotool, and wmctrl as dependencies — your package manager will install them automatically.

          ---

          ### System Requirements

          | Platform | Minimum |
          |----------|---------|
          | Windows  | Windows 10 (64-bit) or newer |
          | macOS    | macOS 10.15 Catalina or newer |
          | Linux    | Ubuntu 22.04 / Fedora 38 or equivalent (x86_64) |

          ---

          ### All Changes (Commits)

          ${CHANGELOG}
          EOF

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Flowtake ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: /tmp/release_body.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.app.tar.gz
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
