name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.23.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      commit: ${{ steps.validated_ref.outputs.commit }}
    steps:
      - name: Validate requested tag syntax
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, commit, and manifest versions
        id: validated_ref
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "ERROR: release tag commit must already be contained in origin/main" >&2
            exit 1
          }
          node --test test/versionConsistency.test.js
          node -e "const version=require('./package.json').version; if ('v'+version !== process.env.RELEASE_TAG) { console.error('Tag does not match package version'); process.exit(1) }"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release_quality_gate:
    name: Release test and security gate (validated commit)
    needs: validate_release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate_release.outputs.commit }}
          persist-credentials: false

      - name: Verify checkout is the validated release commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate_release.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Audit Rust dependencies
        shell: bash
        run: bash ./scripts/run-cargo-audit.sh

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Run release and security regression tests
        run: >-
          node --test
          test/releaseWorkflow.test.js
          test/versionConsistency.test.js
          test/nativeCapabilitySecurity.test.js
          test/nativePathSecurity.test.js
          test/youtubeOAuthSecurity.test.js
          test/liveStreamingSecurity.test.js
          test/updatesSettings.test.js

      - name: Run complete Node test suite
        run: npm test

      - name: Lint JavaScript with the repository warning policy
        run: npm run lint

      - name: Build frontend
        run: npm run build:frontend

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libpulse-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri validates the configured sidecar during build-script execution.
      # This compile-only gate uses a host executable; platform release jobs
      # independently fetch and verify the real pinned FFmpeg artifacts.
      - name: Prepare compile-only Linux sidecar
        run: install -Dm755 /bin/true src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu

      - name: Cargo check
        run: cargo check --locked --all-targets
        working-directory: src-tauri

      - name: Cargo unit tests
        run: cargo test --lib --locked
        working-directory: src-tauri

      - name: Cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings --allow dead_code
        working-directory: src-tauri

  build-windows:
    name: Build (Windows x64)
    needs: [validate_release, release_quality_gate]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate_release.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg (static Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # BtbN immutable month-end auto-build (retained for two years).
          # SHA-256 is published in the release's checksums.sha256 asset and
          # GitHub release metadata.
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-30-13-34/ffmpeg-N-125365-g9a01c1cb6a-win64-gpl.zip"
          $expectedSha256 = "52c0383c460f0ec1039088f1591921fb82e3b870b32aab8faf2ff1e5ae14bf9d"

          Write-Host "Downloading pinned FFmpeg archive..."
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          $actualSha256 = (Get-FileHash -Path ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -Path ffmpeg.zip -Force -ErrorAction SilentlyContinue
            Write-Error "FFmpeg SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          Write-Host "FFmpeg SHA-256 verified: $actualSha256"
          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $ffmpegExe = Get-ChildItem -Recurse -Path ffmpeg_tmp -Filter "ffmpeg.exe" |
            Where-Object { $_.DirectoryName -like "*bin*" } |
            Select-Object -First 1
          if (-not $ffmpegExe) {
            Write-Error "ffmpeg.exe not found in archive"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item -Path $ffmpegExe.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          Write-Host "FFmpeg placed at src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Windows installers and portable binary
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p installers

          # Installers
          nsis_installers=(src-tauri/target/release/bundle/nsis/*.exe)
          msi_installers=(src-tauri/target/release/bundle/msi/*.msi)
          if (( ${#nsis_installers[@]} == 0 )); then
            echo "ERROR: Tauri produced no Windows NSIS installer" >&2
            exit 1
          fi
          if (( ${#msi_installers[@]} == 0 )); then
            echo "ERROR: Tauri produced no Windows MSI installer" >&2
            exit 1
          fi
          cp "${nsis_installers[@]}" installers/
          cp "${msi_installers[@]}" installers/

          # Portable standalone binary (zip with ffmpeg sidecar)
          mkdir -p _portable/Flowtake
          cp src-tauri/target/release/flowtake.exe _portable/Flowtake/Flowtake.exe
          cp src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe _portable/Flowtake/ffmpeg.exe
          cd _portable && 7z a -tzip ../installers/Flowtake-windows-x64-portable.zip Flowtake/ && cd ..
          test -s installers/Flowtake-windows-x64-portable.zip

          echo "=== Collected files ==="
          ls -la installers/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installers
          path: installers/*
          if-no-files-found: error

  build-linux:
    name: Build (Linux x64)
    needs: [validate_release, release_quality_gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate_release.outputs.commit }}
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libpulse-dev \
            rpm \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg (static Linux x64)
        run: |
          set -euo pipefail

          # John Van Sickle's versioned FFmpeg 7.0.2 static build. The exact
          # artifact also matches the MD5 published for the 7.0.2 release;
          # this stronger SHA-256 is pinned here and checked before extraction.
          FFMPEG_URL="https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz"
          FFMPEG_SHA256="abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67"

          echo "Downloading pinned FFmpeg static build for Linux x64..."
          curl --fail --location --show-error --silent \
            "$FFMPEG_URL" \
            --output ffmpeg.tar.xz
          printf '%s  %s\n' "$FFMPEG_SHA256" ffmpeg.tar.xz | sha256sum --check --strict -

          mkdir -p ffmpeg_tmp
          tar -xf ffmpeg.tar.xz -C ffmpeg_tmp
          FFMPEG_BIN=$(find ffmpeg_tmp -maxdepth 3 -name "ffmpeg" -type f | head -1)
          if [ -z "$FFMPEG_BIN" ]; then
            echo "ERROR: ffmpeg binary not found in archive"
            exit 1
          fi
          mkdir -p src-tauri/binaries
          cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          echo "FFmpeg placed at src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu"

      - name: Build Tauri app
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux installers and portable binary
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p installers

          # Installers
          deb_installers=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          rpm_installers=(src-tauri/target/release/bundle/rpm/*.rpm)
          if (( ${#deb_installers[@]} == 0 )); then
            echo "ERROR: Tauri produced no Linux DEB package" >&2
            exit 1
          fi
          if (( ${#appimages[@]} == 0 )); then
            echo "ERROR: Tauri produced no Linux AppImage" >&2
            exit 1
          fi
          if (( ${#rpm_installers[@]} == 0 )); then
            echo "ERROR: Tauri produced no Linux RPM package" >&2
            exit 1
          fi
          cp "${deb_installers[@]}" installers/
          cp "${appimages[@]}" installers/
          cp "${rpm_installers[@]}" installers/

          # Portable standalone binary (tar.gz with ffmpeg sidecar)
          mkdir -p _portable/Flowtake
          cp src-tauri/target/release/flowtake _portable/Flowtake/flowtake
          chmod +x _portable/Flowtake/flowtake
          cp src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu _portable/Flowtake/ffmpeg
          chmod +x _portable/Flowtake/ffmpeg
          tar -czf installers/Flowtake-linux-x64-portable.tar.gz -C _portable Flowtake
          test -s installers/Flowtake-linux-x64-portable.tar.gz

          echo "=== Collected files ==="
          ls -la installers/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-installers
          path: installers/*
          if-no-files-found: error

  build-macos:
    name: Build (macOS Universal)
    needs: [validate_release, release_quality_gate]
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate_release.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Test native macOS capture helper
        run: >-
          swift run
          --package-path src-tauri/native/macos-capture
          flowtake-macos-capture-tests

      - name: Build universal native macOS capture helper
        run: bash scripts/build-macos-capture.sh --universal

      - name: Download FFmpeg (macOS)
        run: |
          set -euo pipefail

          # eugeneware/ffmpeg-static immutable b6.0 release assets.
          FFMPEG_ARM64_URL="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64.gz"
          FFMPEG_ARM64_SHA256="6be74d6f449889c2e87a75873894f8520cad56c08ac76f2a628d85b0519daaca"
          FFMPEG_X64_URL="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64.gz"
          FFMPEG_X64_SHA256="a12354fce7eb62361473bbe10d53a1893695babd35869ec8e92e5dfea8d0440b"

          mkdir -p src-tauri/binaries

          # Download FFmpeg for macOS arm64
          echo "Downloading pinned FFmpeg for macOS arm64..."
          curl --fail --location --show-error --silent \
            "$FFMPEG_ARM64_URL" \
            --output ffmpeg-arm64.gz

          # Download FFmpeg for macOS x86_64
          echo "Downloading pinned FFmpeg for macOS x86_64..."
          curl --fail --location --show-error --silent \
            "$FFMPEG_X64_URL" \
            --output ffmpeg-x64.gz

          printf '%s  %s\n%s  %s\n' \
            "$FFMPEG_ARM64_SHA256" ffmpeg-arm64.gz \
            "$FFMPEG_X64_SHA256" ffmpeg-x64.gz \
            | shasum -a 256 --check

          gunzip -f ffmpeg-arm64.gz
          chmod +x ffmpeg-arm64
          gunzip -f ffmpeg-x64.gz
          chmod +x ffmpeg-x64

          # Create universal fat binary with lipo (required for --target universal-apple-darwin)
          echo "Creating universal FFmpeg binary with lipo..."
          lipo -create -output src-tauri/binaries/ffmpeg-universal-apple-darwin \
            ffmpeg-arm64 ffmpeg-x64
          chmod +x src-tauri/binaries/ffmpeg-universal-apple-darwin

          # Also place per-arch copies (needed for per-arch compilation steps)
          cp ffmpeg-arm64 src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp ffmpeg-x64 src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin

          echo "FFmpeg binaries ready (universal + per-arch)"

      - name: Build Tauri app (universal macOS)
        run: npm run build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect macOS installers and portable app
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p installers

          # Installers
          dmg_installers=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if (( ${#dmg_installers[@]} == 0 )); then
            echo "ERROR: Tauri produced no macOS DMG" >&2
            exit 1
          fi
          cp "${dmg_installers[@]}" installers/

          # Portable .app bundle (zip it for direct download)
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Flowtake.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Tauri produced no macOS Flowtake.app bundle" >&2
            exit 1
          fi
          MAC_CAPTURE_HELPER="$APP_PATH/Contents/Resources/binaries/flowtake-macos-capture-universal-apple-darwin"
          if [ ! -x "$MAC_CAPTURE_HELPER" ]; then
            echo "ERROR: Flowtake.app is missing the executable ScreenCaptureKit helper" >&2
            exit 1
          fi
          file "$MAC_CAPTURE_HELPER" | grep -q "arm64"
          file "$MAC_CAPTURE_HELPER" | grep -q "x86_64"
          "$MAC_CAPTURE_HELPER" capabilities | grep -q '"captureEngine":"ScreenCaptureKit"'
          pushd "$(dirname "$APP_PATH")"
          zip -r -y "$GITHUB_WORKSPACE/installers/Flowtake-macos-universal.zip" Flowtake.app
          popd
          test -s installers/Flowtake-macos-universal.zip

          # Also grab the .app.tar.gz if Tauri generated it
          app_archives=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          if (( ${#app_archives[@]} > 0 )); then
            cp "${app_archives[@]}" installers/
          fi

          echo "=== Collected files ==="
          ls -la installers/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: [validate_release, release_quality_gate, build-windows, build-linux, build-macos]
    if: always() && needs.release_quality_gate.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate_release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get version tag
        id: version
        env:
          RELEASE_TAG: ${{ needs.validate_release.outputs.tag }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Generate changelog from commits
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Current tag: $TAG"

          # Find the previous tag (exclude current tag)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          echo "Previous tag: ${PREV_TAG:-none}"

          # Use HEAD as the endpoint (the checkout IS the tagged commit)
          # Fall back gracefully if git log fails
          if [ -n "$PREV_TAG" ] && git rev-parse "${PREV_TAG}" >/dev/null 2>&1; then
            CHANGELOG=$(git log --pretty=format:"- %h %s (%an)" --reverse "${PREV_TAG}..HEAD" 2>/dev/null || echo "- See full commit history on GitHub")
          else
            echo "No valid previous tag, listing recent commits"
            CHANGELOG=$(git log --pretty=format:"- %h %s (%an)" --reverse -50 HEAD 2>/dev/null || echo "- See full commit history on GitHub")
          fi

          # Write to file to preserve formatting
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "Generated changelog with $(wc -l < /tmp/changelog.txt) entries"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Verify complete release payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          require_non_empty() {
            local label="$1"
            shift
            local matches=("$@")
            if (( ${#matches[@]} == 0 )); then
              echo "ERROR: Missing required release artifact: $label" >&2
              exit 1
            fi
            for file in "${matches[@]}"; do
              if [ ! -s "$file" ]; then
                echo "ERROR: Required release artifact is empty: $file" >&2
                exit 1
              fi
            done
          }

          require_non_empty "Windows NSIS installer" artifacts/windows-installers/*.exe
          require_non_empty "Windows MSI installer" artifacts/windows-installers/*.msi
          require_non_empty "Windows portable ZIP" artifacts/windows-installers/Flowtake-windows-x64-portable.zip
          require_non_empty "macOS DMG" artifacts/macos-installers/*.dmg
          require_non_empty "macOS portable ZIP" artifacts/macos-installers/Flowtake-macos-universal.zip
          require_non_empty "Linux DEB package" artifacts/linux-installers/*.deb
          require_non_empty "Linux AppImage" artifacts/linux-installers/*.AppImage
          require_non_empty "Linux RPM package" artifacts/linux-installers/*.rpm
          require_non_empty "Linux portable archive" artifacts/linux-installers/Flowtake-linux-x64-portable.tar.gz

      - name: Stage flat release assets and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ -e release-assets ]]; then
            echo "ERROR: release-assets must not exist before staging" >&2
            exit 1
          fi
          mkdir release-assets

          release_files=(
            artifacts/windows-installers/*.exe
            artifacts/windows-installers/*.msi
            artifacts/windows-installers/Flowtake-windows-x64-portable.zip
            artifacts/macos-installers/*.dmg
            artifacts/macos-installers/Flowtake-macos-universal.zip
            artifacts/linux-installers/*.deb
            artifacts/linux-installers/*.AppImage
            artifacts/linux-installers/*.rpm
            artifacts/linux-installers/Flowtake-linux-x64-portable.tar.gz
          )
          declare -A staged_names=()
          for source in "${release_files[@]}"; do
            name="$(basename "$source")"
            if [[ -n "${staged_names[$name]:-}" ]]; then
              echo "ERROR: duplicate flat release filename: $name" >&2
              exit 1
            fi
            staged_names[$name]=1
            cp -- "$source" "release-assets/$name"
          done

          (
            cd release-assets
            while IFS= read -r -d '' file; do
              sha256sum "$file"
            done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z)
          ) > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Build release body
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CHANGELOG=$(cat /tmp/changelog.txt)
          cat > /tmp/release_body.md << EOF
          ## Flowtake ${TAG}

          **Screen recorder with automatic zoom animations** — available for Windows, macOS, and Linux.

          ---

          ### Download

          | Platform | File | Notes |
          |----------|------|-------|
          | **Windows** (x64) | \`.exe\` installer | Recommended — guided setup with NSIS |
          | **Windows** (x64) | \`.msi\` installer | Silent / enterprise installs |
          | **Windows** (x64) | \`-portable.zip\` | No install needed — extract and run |
          | **macOS** (Universal) | \`.dmg\` | Runs natively on Apple Silicon & Intel |
          | **macOS** (Universal) | \`.zip\` | Portable — extract Flowtake.app directly |
          | **Linux** (x64) | \`.AppImage\` | Portable — works on any Linux distro |
          | **Linux** (x64) | \`.deb\` | Debian, Ubuntu, and derivatives |
          | **Linux** (x64) | \`.rpm\` | Fedora, RHEL, openSUSE, and derivatives |
          | **Linux** (x64) | \`-portable.tar.gz\` | No install needed — extract and run |

          ---

          ### Installation Instructions

          #### Windows
          1. Download the \`.exe\` installer
          2. Run it and follow the on-screen prompts
          3. FFmpeg is bundled — no extra dependencies needed

          #### macOS
          1. Download the \`.dmg\` file
          2. Open the disk image and drag **Flowtake** into your Applications folder
          3. On first launch, right-click the app → **Open** if macOS shows an unverified developer warning
          4. FFmpeg is bundled — no extra dependencies needed

          #### Linux
          - **Debian/Ubuntu** (\`.deb\`):
            \`\`\`bash
            sudo dpkg -i flowtake_*.deb
            sudo apt-get install -f   # resolve any missing dependencies
            \`\`\`
          - **AppImage** (universal):
            \`\`\`bash
            chmod +x Flowtake_*.AppImage
            ./Flowtake_*.AppImage
            \`\`\`
          - **Fedora/RHEL** (\`.rpm\`):
            \`\`\`bash
            sudo rpm -i flowtake-*.rpm
            \`\`\`

          > **Linux note:** The \`.deb\` and \`.rpm\` packages declare ffmpeg, xdotool, and wmctrl as dependencies — your package manager will install them automatically.

          ---

          ### System Requirements

          | Platform | Minimum |
          |----------|---------|
          | Windows  | Windows 10 (64-bit) or newer |
          | macOS    | macOS 10.15 Catalina or newer |
          | Linux    | Ubuntu 22.04 / Fedora 38 or equivalent (x86_64) |

          ---

          ### All Changes (Commits)

          ${CHANGELOG}
          EOF

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' /tmp/release_body.md

      - name: Reverify immutable release target
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate_release.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate_release.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$EXPECTED_COMMIT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Flowtake ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: /tmp/release_body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*
