name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run JavaScript tests
        run: npm test

      - name: Build frontend
        run: npm run build:frontend

  rust-security-audit:
    name: Rust Security Audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Audit Rust dependencies
        shell: bash
        run: bash ./scripts/run-cargo-audit.sh

  check-rust:
    name: Rust Check (${{ matrix.platform.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            deps: ''
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
            deps: ''
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deps: |
              sudo apt-get update
              sudo apt-get install -y \
                libwebkit2gtk-4.1-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                libssl-dev \
                libgtk-3-dev \
                libx11-dev \
                libxcb1-dev \
                libxrandr-dev \
                libpulse-dev

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.platform.deps != ''
        run: ${{ matrix.platform.deps }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri validates that its configured sidecar exists during build-script
      # execution. Release builds download the real Linux FFmpeg binary; CI only
      # needs a host executable so Rust source can be checked without a network
      # download from a mutable third-party release URL.
      - name: Prepare Linux sidecar for compile-only checks
        if: runner.os == 'Linux'
        run: install -Dm755 /bin/true src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu

      - name: Cargo check
        run: cargo check --locked --all-targets
        working-directory: src-tauri

      - name: Cargo unit tests
        run: cargo test --lib --locked
        working-directory: src-tauri

      - name: Cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings --allow dead_code
        working-directory: src-tauri
