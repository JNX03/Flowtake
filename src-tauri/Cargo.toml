[package]
name = "flowtake"
version = "1.4.3"
description = "Screen recorder with automatic zoom animations"
authors = ["Jnx03 <jn03official@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/JNX03/Flowtake"

[lib]
name = "flowtake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
thiserror = "2"
dirs = "6"
zip = "8"
glob = "0.3"
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
futures-util = "0.3"
sha2 = "0.11"
open = "5"
log = "0.4"
env_logger = "0.11"
notify-rust = "4"
hostname = "0.4"
sysinfo = "0.38"
walkdir = "2"
base64 = "0.22"
chrono = "0.4"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc = "0.2"
cocoa = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib", "xrandr", "xrecord", "xinput"] }
libpulse-binding = "2.28"

[patch.crates-io]
# tauri-utils still pulls kuchikiki -> selectors -> phf_generator 0.8.
# Keep that old PHF API but move its RNG dependency onto patched rand 0.8.6.
phf_generator = { path = "vendor/phf_generator-0.8.0" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
