<!DOCTYPE html>
<html data-theme="dark" lang="en" class="h-full max-h-full bg-base-300">

<head>
  <meta charset="UTF-8" />
  <title>Flowtake</title>
  <link rel="icon" type="image/png" href="./src/renderer/src/assets/favicon.png" />
  <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' https://asset.localhost asset:;
      script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval';
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https://asset.localhost asset:;
      media-src 'self' blob: data: https://asset.localhost http://video.localhost asset: stream:;
      connect-src 'self' https: http: ws: wss: ipc: https://asset.localhost http://video.localhost asset:;
      font-src 'self' data:;" />
</head>

<body class="hyphens-auto h-full max-h-full bg-base-300">
  <div id="root" class="h-full max-h-full pt-8 m-0 relative"></div>
  <!-- Splash screen with real-time progress -->
  <div id="splash">
    <style>
      @keyframes splash-in { from { opacity:0 } to { opacity:1 } }
      @keyframes splash-check { from { opacity:0;transform:scale(0.5) } to { opacity:1;transform:scale(1) } }
      #splash {
        position:fixed;inset:0;z-index:9999;
        background:#0f0f23;
        display:flex;flex-direction:column;
        animation: splash-in .15s ease-out;
      }
      #splash.removing { opacity:0; transition:opacity .15s ease-out }
      #splash-titlebar {
        height:32px;display:flex;align-items:center;padding:0 8px;
        -webkit-app-region:drag;flex-shrink:0;
      }
      #splash-titlebar-icon { width:20px;height:20px;margin-right:8px;border-radius:4px }
      #splash-titlebar-text {
        font-family:Poppins,system-ui,sans-serif;font-size:14px;font-weight:600;
        color:rgba(240,240,255,0.85);margin:0;
      }
      #splash-content {
        flex:1;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:24px;
      }
      #splash-logo {
        width:64px;height:64px;border-radius:14px;
        filter:drop-shadow(0 0 20px rgba(108,92,231,0.3));
      }
      #splash-brand {
        font-family:Poppins,system-ui,sans-serif;font-size:20px;font-weight:600;
        color:rgba(240,240,255,0.9);margin:0;letter-spacing:0.01em;
      }
      #splash-loader { display:flex;flex-direction:column;align-items:center;gap:14px;width:220px }
      #splash-bar-track {
        width:100%;height:3px;border-radius:2px;
        background:rgba(108,92,231,0.12);overflow:hidden;
      }
      #splash-bar-fill {
        height:100%;border-radius:2px;width:0%;
        background:linear-gradient(90deg,#6C5CE7,#00CEC9);
        transition:width .4s cubic-bezier(0.4,0,0.2,1);
      }
      #splash-stages { display:flex;flex-direction:column;gap:6px;width:100% }
      .splash-stage {
        display:flex;align-items:center;gap:8px;
        font-family:system-ui,sans-serif;font-size:11px;font-weight:400;
        color:rgba(240,240,255,0.2);margin:0;
        transition:color .3s ease,opacity .3s ease;
      }
      .splash-stage.active { color:rgba(240,240,255,0.6) }
      .splash-stage.done { color:rgba(0,206,201,0.7) }
      .splash-stage-icon {
        width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      }
      .splash-stage-spinner {
        width:12px;height:12px;border:1.5px solid rgba(108,92,231,0.3);
        border-top-color:#6C5CE7;border-radius:50%;
        animation:splash-spin .6s linear infinite;
      }
      @keyframes splash-spin { to { transform:rotate(360deg) } }
      .splash-stage-check {
        animation:splash-check .2s ease-out;
      }
    </style>
    <div id="splash-titlebar">
      <svg id="splash-titlebar-icon" viewBox="0 0 256 256" fill="none">
        <rect x="10" y="10" width="236" height="236" rx="50" ry="50" fill="#0f0f23"/>
        <rect x="15" y="15" width="226" height="226" rx="46" ry="46" fill="#12122a"/>
        <polygon points="103,76 192,128 103,180" fill="#6C5CE7"/>
        <polygon points="107,82 180,124 107,128" fill="#8C7AFF" opacity="0.4"/>
        <rect x="62" y="100" width="22" height="7" rx="3.5" fill="#00CEC9"/>
        <rect x="56" y="123" width="30" height="7" rx="3.5" fill="#00CEC9"/>
        <rect x="65" y="146" width="16" height="7" rx="3.5" fill="#00CEC9"/>
      </svg>
      <p id="splash-titlebar-text">Flowtake</p>
    </div>
    <div id="splash-content">
      <svg id="splash-logo" viewBox="0 0 256 256" fill="none">
        <rect x="10" y="10" width="236" height="236" rx="50" ry="50" fill="#0f0f23"/>
        <rect x="15" y="15" width="226" height="226" rx="46" ry="46" fill="#12122a"/>
        <rect x="15" y="15" width="226" height="226" rx="46" ry="46" fill="url(#sg)" />
        <defs><linearGradient id="sg" x1="0.3" y1="0" x2="0.7" y2="1">
          <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
        </linearGradient></defs>
        <polygon points="103,76 192,128 103,180" fill="#6C5CE7"/>
        <polygon points="107,82 180,124 107,128" fill="#8C7AFF" opacity="0.4"/>
        <rect x="62" y="100" width="22" height="7" rx="3.5" fill="#00CEC9"/>
        <rect x="56" y="123" width="30" height="7" rx="3.5" fill="#00CEC9"/>
        <rect x="65" y="146" width="16" height="7" rx="3.5" fill="#00CEC9"/>
        <rect x="10" y="10" width="236" height="236" rx="50" ry="50" fill="none" stroke="#6C5CE7" stroke-opacity="0.15" stroke-width="1.5"/>
      </svg>
      <p id="splash-brand">Flowtake</p>
      <div id="splash-loader">
        <div id="splash-bar-track"><div id="splash-bar-fill"></div></div>
        <div id="splash-stages">
          <p class="splash-stage active" data-stage="bridge">
            <span class="splash-stage-icon"><span class="splash-stage-spinner"></span></span>
            Initializing core
          </p>
          <p class="splash-stage" data-stage="framework">
            <span class="splash-stage-icon"></span>
            Loading interface
          </p>
          <p class="splash-stage" data-stage="store">
            <span class="splash-stage-icon"></span>
            Preparing workspace
          </p>
          <p class="splash-stage" data-stage="render">
            <span class="splash-stage-icon"></span>
            Building UI
          </p>
          <p class="splash-stage" data-stage="devices">
            <span class="splash-stage-icon"></span>
            Detecting devices
          </p>
        </div>
      </div>
    </div>
  </div>
  <div id="error-overlay" style="display:none;position:fixed;inset:0;z-index:99999;background:#1a1a2e;overflow:auto;"></div>
  <script>
    // Splash progress API
    var _splashStages = ['bridge','framework','store','render','devices'];
    var _splashDone = {};
    var _checkSvg = '<svg class="splash-stage-check" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6L5 8.5L9.5 3.5" stroke="#00CEC9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    window.splashUpdate = function(stageId) {
      _splashDone[stageId] = true;
      var doneCount = 0;
      for (var i = 0; i < _splashStages.length; i++) {
        var sid = _splashStages[i];
        var el = document.querySelector('[data-stage="'+sid+'"]');
        if (!el) continue;
        if (_splashDone[sid]) {
          doneCount++;
          el.className = 'splash-stage done';
          el.querySelector('.splash-stage-icon').innerHTML = _checkSvg;
        } else if (doneCount === i) {
          el.className = 'splash-stage active';
          el.querySelector('.splash-stage-icon').innerHTML = '<span class="splash-stage-spinner"></span>';
        }
      }
      var pct = (doneCount / _splashStages.length) * 100;
      var fill = document.getElementById('splash-bar-fill');
      if (fill) fill.style.width = pct + '%';
    };

    window.splashDismiss = function() {
      var fill = document.getElementById('splash-bar-fill');
      if (fill) fill.style.width = '100%';
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('removing');
        // Use display:none after fade instead of remove() to avoid
        // interfering with React's DOM reconciliation
        setTimeout(function() {
          splash.style.display = 'none';
          splash.style.pointerEvents = 'none';
        }, 160);
      }
    };

    // Global error handlers — render in a separate overlay so we never
    // destroy React's DOM tree (which causes removeChild errors).
    function _showErrorOverlay(html) {
      var overlay = document.getElementById('error-overlay');
      if (overlay) {
        overlay.style.display = 'block';
        overlay.innerHTML = html;
      }
    }
    window.onerror = function(msg, url, line, col, error) {
      _showErrorOverlay('<pre style="color:red;padding:20px;font-size:14px;">ERROR: ' + msg + '\n' + url + ':' + line + ':' + col + '\n' + (error ? error.stack : '') + '</pre>');
    };
    window.addEventListener('unhandledrejection', function(e) {
      _showErrorOverlay('<pre style="color:red;padding:20px;font-size:14px;">PROMISE ERROR: ' + e.reason + '\n' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre>');
    });
  </script>
  <script type="module" src="./src/renderer/main/src/main.jsx"></script>
</body>

</html>
